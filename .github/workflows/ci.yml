name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # The dependency points one way: this job obtains the engine's executable and nothing
  # else. Conformance is a property of this plugin, so the suite is driven here; the
  # engine repository's CI carries only its own fake plugin.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Tests
        run: |
          npm ci
          npm test

      - name: Install the veridoc executable
        run: |
          set -eu
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository_owner }}/veridoc/main/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The checkout is everything the command receives: it reads veridoc-plugin.json,
      # runs the build steps, and drives the suite against the built server.
      - name: Validate this plugin's checkout
        run: veridoc validate-plugin

      # The example names this repository's built server directly and reads its
      # authoring packages from the workspace; a green check is the end-to-end gate.
      - name: The example runs green
        run: veridoc check --project examples/scanner
